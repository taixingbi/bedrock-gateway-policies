# Tenant policy config (M2). Stands in for the DynamoDB-backed control
# plane in plan section 8 -- see services/gateway/policy/store.py.
#
# Loaded once at startup by FilePolicyStore. To change a tenant's state
# at runtime without restarting the gateway, use the admin API instead of
# editing this file:
#
#   PUT /v1/admin/tenants/{tenant_id}/state   {"state": "SUSPENDED"}
#
# (requires a token with the ADMIN_REQUIRED_ROLE role, default
# platform_admin) -- that takes effect immediately via push invalidation,
# whereas a file edit only takes effect on the next process restart.

tenants:
  # Renamed 2026-09-23 from "finance" (settings unchanged) -- team-a
  # removed entirely in the same change, see git log for the prior
  # tenant list.
  tenant1-finance:
    state: ACTIVE
    models:
      - us.amazon.nova-micro-v1:0
      # more models coming later -- add their inference profile IDs here
      # once confirmed accessible (aws bedrock list-inference-profiles)
    rpm_limit: 300
    guardrail_policy: finance-v1
    route_set: finance-chat-v1
    slo:
      p95_latency_ms: 3000
    policy_epoch: 1
    queue_enabled: true # 2026-09-23: wait up to queue_max_wait_s (default 5s) for a freed concurrency slot instead of an immediate 429

  # Renamed 2026-09-23 from "search" (settings unchanged).
  tenant2-search:
    state: ACTIVE
    models:
      - us.amazon.nova-micro-v1:0
      # more models coming later -- add their inference profile IDs here
      # once confirmed accessible (aws bedrock list-inference-profiles)
    rpm_limit: 120
    guardrail_policy: standard-v1
    route_set: search-chat-v1
    slo:
      p95_latency_ms: 5000
    policy_epoch: 1

  # Renamed 2026-09-23 from "sandbox" (settings unchanged).
  tenant0-sandbox:
    state: ACTIVE
    models: []   # no restriction beyond the gateway default model
    rpm_limit: 30
    guardrail_policy: standard-v1
    policy_epoch: 1
